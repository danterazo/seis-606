<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a9df4" />
    <title>Dante's Cluster</title>
    <link rel="stylesheet" href="/aero.css" />
    <script type="module" src="/aero.js"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span><span class="bubble b4"></span>
    </div>

    <header class="topbar">
      <a class="brand" href="/" aria-label="Dante's Cluster home">
        <span class="brand-orb" aria-hidden="true"></span>
        <span class="brand-text"><strong>Dante's Cluster</strong><small>Work Hard, Ball Harder</small></span>
      </a>
      <div class="topbar-actions">
        <span class="updated" id="updated" aria-live="polite">Connecting…</span>
        <button class="aqua-button" id="refresh-button" type="button">
          <span class="refresh-icon" aria-hidden="true">↻</span> Refresh
        </button>
      </div>
    </header>

    <main class="layout">
      <section class="banner" id="banner" role="status" aria-live="polite"></section>

      <aside class="panel nodes-panel" aria-labelledby="nodes-heading">
        <h2 id="nodes-heading"><span class="title-icon icon-server" aria-hidden="true"></span>Nodes</h2>
        <div class="node-list" id="node-list"></div>
      </aside>

      <section class="center">
        <div class="panel" aria-labelledby="overview-heading">
          <h2 id="overview-heading"><span class="title-icon icon-monitor" aria-hidden="true"></span>System Overview</h2>
          <div class="tiles" id="overview"></div>
        </div>

        <div class="panel" aria-labelledby="topology-heading">
          <h2 id="topology-heading"><span class="title-icon icon-globe" aria-hidden="true"></span>Topology</h2>
          <div class="legend" aria-hidden="true">
            <span><i class="dot dot-node"></i>Node</span><span><i class="dot dot-vm"></i>VM</span><span><i class="dot dot-lxc"></i>LXC</span><span><i class="dot dot-stripe"></i>Stripe = node</span>
          </div>
          <div class="topology" id="topology"></div>
        </div>

        <div class="panel" aria-labelledby="usage-heading">
          <h2 id="usage-heading"><span class="title-icon icon-chart" aria-hidden="true"></span>Resource Usage</h2>
          <div class="usage" id="usage"></div>
        </div>
      </section>

      <aside class="panel guests-panel" aria-labelledby="guests-heading">
        <h2 id="guests-heading"><span class="title-icon icon-cube" aria-hidden="true"></span><span id="guests-title">Guests</span></h2>
        <label class="search"><span class="sr-only">Search guests</span><input id="search" type="search" placeholder="Search by name or ID" autocomplete="off" /></label>
        <div class="chips" id="chips" role="group" aria-label="Filter guests"></div>
        <ul class="guest-list" id="guest-list"></ul>
      </aside>
    </main>

    <footer class="footer"><span id="source-label">—</span><span>Read-only · refreshes every 30 seconds</span></footer>
  </body>
</html>
