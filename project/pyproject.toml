[project]
name = "homelab-dashboard"
version = "0.1.0"
description = "Homelab inventory dashboard"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.39.0",
  "proxmoxer>=2.0.0",
  "pydantic>=2.9.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
