[tool.poetry]
    name = "seis-606"
    version = "0.1.0"
    description = "SEIS-606 Coursework & Assignments"
    authors = ["Dante Razo <razo3843@stthomas.edu>"]
    readme = "README.md"
    package-mode = false

[tool.poetry.dependencies]
    python = ">=3.14"

    # common
    ipykernel = "*"
    jupyter = "*"
    nbconvert = "*"
    pylance = "*"
    torch = { version = "*", source = "torch-cuda" } # torch w/ GPU acceleration
    dotenv = "*"

    # first used in hw2
    diffusers = "*"
    optimum-quanto = "*"
    bitsandbytes = "*"
    
    # first used in hw3
    specify-cli = "*"

    # project
    proxmoxer = ">=2.0.0"
    pydantic = ">=2.9.0"
    pytest = ">=8.0.0"
    ruff = ">=0.6.0"
    streamlit = ">=1.39.0"


[[tool.poetry.source]]
    name = "pypi"
    priority = "primary"


# for desktop
[[tool.poetry.source]]
    name = "torch-cuda"
    url = "https://download.pytorch.org/whl/cu130"
    priority = "explicit"

# for server
[[tool.poetry.source]]
    name = "torch-rocm"
    url = "https://download.pytorch.org/whl/rocm7.0"
    priority = "explicit"

[build-system]
    requires = ["poetry-core"]
    build-backend = "poetry.core.masonry.api"

[tool.ruff]
    line-length = 150
    exclude = [".git", ".venv"]

[tool.pytest.ini_options]
    pythonpath = ["project"]

[tool.basedpyright]
    # glob expands automatically; no need to enumerate/regenerate per-assignment paths
    extraPaths = ["project", "assignments/*"]
